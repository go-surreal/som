name: tests

on:
  push:
    branches: [ "main" ]

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          working_directory: internal/tests/basic
          install: true
          cache: true

      - name: Cache Go Modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: "go-mod-tests-${{ hashFiles('internal/tests/basic/go.sum') }}"
          restore-keys: "go-mod-tests-"

      - name: Cache Go Build
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: "go-build-tests-${{ github.sha }}"
          restore-keys: "go-build-tests-"

      - name: Test Basic (with coverage for generated layer)
        working-directory: internal/tests/basic
        env:
          GOTOOLCHAIN: local
          GOWORK: "off"
        run: |
          go test \
          -coverprofile=coverage.txt -covermode=atomic \
          -coverpkg=som.test/gen/som/... \
          -v ./...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./internal/tests/basic/coverage.txt
